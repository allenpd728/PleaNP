name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Install Lean toolchain
        run: lean --version
        working-directory: lean
      - name: Build (fails on sorry via per-file warningAsError)
        run: lake build
        working-directory: lean
      - name: Hygiene scan (Gate 6 Tier 1)
        run: python3 tooling/gates/hygiene_scan.py --prove-stage lean/PleaNP
