name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Install Lean toolchain
        run: lean --version
        working-directory: lean
      - name: Restore Mathlib olean cache (community Azure cache; DEC-013)
        run: lake exe cache get
        working-directory: lean
      # NOTE (DEC-013 / B): the full-tree `lake build` is intentionally NOT the
      # CI gate right now. Post-merge (2026-09-06, dev+main reconciliation) the
      # v4 Oracle substrate (Oracle.lean / OracleComplexity.lean / OracleSmoke.lean)
      # and the Rung-5 Barrier Calculus module ALL build green. The full tree still
      # fails ONLY on two documented pending-sorry modules: OracleUpstreamP (upstream
      # P anchor, expected to fail) and Relativization (BGS statement placeholders) —
      # see docs/SORRY_TRACKER.md. CI therefore gates on every module that is
      # actually clean, so the "build oracle" stays green; widen to the full tree
      # when the pending sorries are resolved.
      - name: Build clean modules (Basic + v4 substrate + Barrier Calculus; sorry-as-error)
        run: lake build PleaNP.Basic PleaNP.Calculus.BarrierCalculus PleaNP.Computability.Oracle PleaNP.Computability.OracleComplexity PleaNP.Computability.OracleSmoke
        working-directory: lean
      - name: Hygiene scan (Gate 6 Tier 1)
        run: python3 tooling/gates/hygiene_scan.py --prove-stage lean/PleaNP/Calculus lean/PleaNP/Basic.lean lean/PleaNP/Computability/Oracle.lean lean/PleaNP/Computability/OracleComplexity.lean lean/PleaNP/Computability/OracleSmoke.lean
      - name: Vacuity scan (Gate 5 Tier 1)
        run: python3 tooling/gates/vacuity_scan.py lean/PleaNP/Calculus lean/PleaNP/Basic.lean lean/PleaNP/Computability/Oracle.lean lean/PleaNP/Computability/OracleComplexity.lean lean/PleaNP/Computability/OracleSmoke.lean
      - name: Model-consistency scan (Gate 2 Tier 1)
        run: python3 tooling/gates/model_consistency_scan.py lean/PleaNP/Calculus lean/PleaNP/Basic.lean lean/PleaNP/Computability/Oracle.lean lean/PleaNP/Computability/OracleComplexity.lean lean/PleaNP/Computability/OracleSmoke.lean
      - name: Binder-usage scan (Gate 5 Tier 1b)
        run: python3 tooling/gates/binder_usage_scan.py --allow-unreferenced '^(exists_equalizing_oracle|exists_separating_oracle|smoke_accepts_true|smoke_rejects_false)$' lean/PleaNP/Calculus lean/PleaNP/Basic.lean lean/PleaNP/Computability/Oracle.lean lean/PleaNP/Computability/OracleComplexity.lean lean/PleaNP/Computability/OracleSmoke.lean
      - name: Axiom check (Gate 6 Tier 2 — no smuggled sorry via meta-programs)
        run: python3 ../tooling/gates/axiom_check.py PleaNP.Computability.Oracle,PleaNP.Computability.OracleComplexity,PleaNP.Computability.OracleSmoke,PleaNP.Calculus.BarrierCalculus PleaNP.Oracles.evalsTo_unique_result PleaNP.Oracles.P_A_subset_NP_A PleaNP.Oracles.smoke_accepts_true PleaNP.Oracles.smoke_rejects_false
        working-directory: lean
      - name: Read-back harness unit tests (Gate 4; no secrets, no Lean needed)
        run: python3 tooling/gates/tests/test_readback.py
      - name: Read-back smoke (Gate 4; deterministic skeleton on a real theorem)
        run: python3 ../tooling/gates/lean_readback.py "PleaNP.Oracles.evalsTo_unique_result" "PleaNP.Computability.Oracle" >/dev/null && echo "read-back smoke ok"
        working-directory: lean
      - name: Gate 3 dual-render unit tests (no secrets, no Lean needed)
        run: python3 tooling/gates/tests/test_dual_render.py
      - name: Gate 3 self-check on authored statements
        run: |
          python3 ../tooling/gates/dual_render.py self "PleaNP.Computability.Oracle" "PleaNP.Oracles.evalsTo_unique_result" >/dev/null
          python3 ../tooling/gates/dual_render.py self "PleaNP.Computability.OracleComplexity" "PleaNP.Oracles.P_A_subset_NP_A" >/dev/null
          python3 ../tooling/gates/dual_render.py self "PleaNP.Calculus.BarrierCalculus" "PleaNP.Calculus.thhStatement" >/dev/null
          echo "Gate 3 self-checks ok"
        working-directory: lean
      - name: Probe-checklist unit tests (Gate 4 Layer 3; no secrets, no Lean)
        run: python3 tooling/gates/tests/test_probe_check.py
      - name: Probe-checklist approve/block smoke (Layer 3)
        run: |
          python3 tooling/gates/probe_check.py checklist tooling/gates/specs/pA_subset_npA.json --answers tooling/gates/specs/pA_subset_npA.answers.ok.json >/dev/null
          if python3 tooling/gates/probe_check.py checklist tooling/gates/specs/pA_subset_npA.json --answers tooling/gates/specs/pA_subset_npA.answers.wrong.json >/dev/null 2>&1; then
            echo "ERROR: wrong answers unexpectedly passed"; exit 1
          fi
          echo "probe-checklist approve/block smoke ok"
