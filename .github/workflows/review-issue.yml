name: review-issue

# Review-inbox-as-issues: the human reviews via GitHub issue comments (no
# local tooling). Two functions:
#  1. workflow_dispatch: turn a local review point (or ad-hoc claim) into a
#     GitHub issue labelled review:pending — one claim, one question.
#  2. issue_comment on an issue labelled review:pending: if the comment body
#     starts with "confirm", apply review:confirmed and close the issue; if
#     it starts with "flag", apply review:flagged, add the reason as a label
#     hint in the issue body, and leave it open (the claim reopens).
#
# Loop guard: issue_comment can't fire on issues created by workflow_dispatch
# of THIS workflow (dispatch-created issues don't emit issue_comment events),
# so there's no self-trigger loop.

on:
  push:
    paths:
      - "reviews/pending/*.yaml"
  workflow_dispatch:
    inputs:
      claim:
        description: "Plain-English claim"
        required: true
        type: string
      machine_summary:
        description: "Machine-derived summary (statement_lint output)"
        required: true
        type: string
      informal:
        description: "The informal step-0 claim"
        required: false
        type: string
      decl:
        description: "Fully-qualified Lean declaration"
        required: false
        type: string
      question:
        description: "The ONE plain-language question for the human"
        required: true
        type: string
      expected:
        description: "Expected answer (yes/no)"
        required: false
        type: string
      spec:
        description: "Optional path to a rendering-disagreement spec under tooling/gates/specs/ (renders its probe checklist into the body)"
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  sync-pending:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: File GitHub issues for pending review points (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --label "review:pending,review:flagged" \
                     --state open --limit 100 --json title,body 2>/dev/null || echo '[]')
          for f in reviews/pending/*.yaml; do
            [ -e "$f" ] || continue
            # Inbox id = the unique review-point id (the filename minus .yaml).
            inbox_id=$(basename "$f" .yaml)
            claim=$(awk -F': ' '/^claim:/{gsub(/"/,"",$2);print $2}' "$f")
            decl=$(awk -F': ' '/^decl:/{gsub(/"/,"",$2);print $2}' "$f")
            q=$(awk -F': ' '/^question:/{gsub(/"/,"",$2);print $2}' "$f")
            sum=$(awk -F': ' '/^machine_summary:/{gsub(/"/,"",$2);print $2}' "$f")
            info=$(awk -F': ' '/^informal:/{gsub(/"/,"",$2);print $2}' "$f")
            exp=$(awk -F': ' '/^expected:/{gsub(/"/,"",$2);print $2}' "$f")
            kind=$(awk -F': ' '/^kind:/{gsub(/"/,"",$2);print $2}' "$f")
            control_of=$(awk -F': ' '/^control_of:/{gsub(/"/,"",$2);print $2}' "$f")
            spec=$(awk -F': ' '/^spec:/{gsub(/"/,"",$2);print $2}' "$f")
            # Rendering-disagreement checklist (optional): if the point YAML
            # carries spec=, inline the renderer's probe checklist into the issue
            # body (question+choices+hint+expected per probe; batch narrative prepended).
            CHECKLIST=""
            if [ -n "$spec" ] && [ "$spec" != none ] && [ -f "tooling/gates/specs/${spec}" ]; then
              CHECKLIST=$(python3 tooling/gates/probe_check.py checklist "tooling/gates/specs/${spec}" 2>/dev/null | sed 's/^/  /')
            fi
            # Dedupe by inbox id (unique per point), not decl (shared by
            # mined/churned points — the earlier bug that doubled issues
            # #7-#16). The issue body carries '(inbox id: <id>)'.
            if echo "$existing" | grep -q "inbox id: *${inbox_id}"; then
              echo "already filed for ${inbox_id}; skipping"
              continue
            fi
            BODY="(inbox id: ${f%.yaml})
          **One question to review (intro-level):**

          **$q**

          - **claim:** ${claim}
          - **machine summary (from Lean):** ${sum}
          - **informal (what we wanted):** ${info}
          - **decl:** \`${decl}\`
          - **expected answer:** ${exp}
          - **kind:** ${kind:-semantic-review}
          - **control_of:** ${control_of:-none}

          ---
          **Probe checklist (from the spec):**

          ${CHECKLIST}
          ---

          To answer, comment on this issue:
          - \`confirm\` — the machine summary matches my intention
          - \`flag <reason>\` — it does not; the claim reopens (reason recorded)"
            gh issue create --repo "$REPO" --title "${claim} — review" \
              --label "review:pending" --body "$BODY"
          done

  create:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Q="${{ github.event.inputs.question }}"
          CLAIM="${{ github.event.inputs.claim }}"
          SUM="${{ github.event.inputs.machine_summary }}"
          INFO="${{ github.event.inputs.informal }}"
          DECL="${{ github.event.inputs.decl }}"
          EXP="${{ github.event.inputs.expected }}"
          SPEC="${{ github.event.inputs.spec }}"
          CHECKLIST=""
          if [ -n "$SPEC" ] && [ "$SPEC" != none ] && [ -f "tooling/gates/specs/${SPEC}" ]; then
            CHECKLIST=$(python3 tooling/gates/probe_check.py checklist "tooling/gates/specs/${SPEC}" 2>/dev/null | sed 's/^/  /')
          fi
          BODY="**One question to review (intro-level):**"
          BODY="$BODY

          **$Q**

          - **claim:** $CLAIM
          - **machine summary (from Lean):** $SUM
          - **informal (what we wanted):** $INFO
          - **decl:** \`$DECL\`
          - **expected answer:** $EXP"
          if [ -n "$CHECKLIST" ]; then
            BODY="$BODY

          ---
          **Probe checklist (from the spec):**

          $CHECKLIST
          ---"
          fi
          BODY="$BODY

          ---
          To answer, comment on this issue:
          - \`confirm\` —the machine summary matches my intention
          - \`flag <reason>\` — it does not;the claim reopens (reason recorded)"

          gh issue create --repo "${{ github.repository }}" \
            --title "$CLAIM — review" \
            --label "review:pending" \
            --body "$BODY"

  respond:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Handle confirm/flag comment on a review:pending issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # Only act on issues labelled review:pending.
          labels=$(gh issue view "$ISSUE" --repo "$REPO" --json labels -q '.labels[].name' || true)
          case " $labels " in
            *" review:pending "*) ;;
            *) echo "not a review:pending issue; ignoring"; exit 0;;
          esac
          body="$BODY"
          first=$(echo "$body" | awk '{print tolower($1); exit}')
          case "$first" in
            confirm)
              gh issue edit "$ISSUE" --repo "$REPO" \
                --remove-label "review:pending" \
                --add-label "review:confirmed"
              gh issue close "$ISSUE" --repo "$REPO" --comment "review:confirmed — machine summary matches intention."
              # AUTO-REQUEUE on confirmed controls: if this issue is a
              # recheck-control (body carries 'control_of'), confirming it is a
              # fatigue signal -> re-file the ORIGINAL claim as a fresh issue so
              # no sweep is needed. Single source of truth: review_inbox.py
              # requeue <orig-id> re-files the confirmed original from the repo
              (we have a checkout), then we push so sync-pending files it.
              control_of=$(echo "$body" | sed -n 's/.*control_of: *\([a-z0-9-]*\).*/\1/p' | head -1)
              if [ "$control_of" != "none" ] && [ -n "$control_of" ]; then
                echo "confirmed a recheck-control (control_of=$control_of): auto-re-queueing original."
                python3 tooling/reviews/review_inbox.py requeue "$control_of" || true
                git add reviews/pending/ >/dev/null 2>&1 || true
                git -c user.name="openhands" -c user.email="openhands@all-hands.dev" \
                    commit -m "chore: auto-requeue review after confirmed control (#$ISSUE)" >/dev/null 2>&1 || true
                git push origin main >/dev/null 2>&1 || echo "note: push skipped (auto-requeue recorded locally)"
              fi
              ;;
            flag)
              reason=$(echo "$body" | sed -n 's/^[Ff]lag[[:space:]]*//p' | head -1)
              gh issue edit "$ISSUE" --repo "$REPO" \
                --remove-label "review:pending" \
                --add-label "review:flagged"
              gh issue comment "$ISSUE" --repo "$REPO" \
                --body "review:flagged — reason: ${reason:-<no reason>}. The claim reopens (agents sweep flagged)."
              ;;
            *)
              echo "comment does not start with confirm/flag; ignoring."
              ;;
          esac