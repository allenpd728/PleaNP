name: warm-toolchain-image

# Build and push a "warm" Lean 4 + Mathlib toolchain image to GitHub
# Container Registry (ghcr.io) — the FREE, persistent artifact that lets EACH
# new agent sandbox (and any human container) skip the elan install + toolchain
# download + Mathlib olean fetch entirely:
#
#   docker pull ghcr.io/allenpd728/pleanp:main
#   # inside: elan + Lean v4.31.0 + Mathlib oleans pre-fetched into
#   # /root/.elan AND /workspace/lean/.lake (warm)
#
# Persistence model (DEC-013 + this workflow): the repo's authoritative state
# is the *tools* (lean-toolchain pin) + *deps* (lakefile.lean pin) + the
# community Mathlib olean cache. A ghcr image is a *cache of a snapshot*, not
# a source of truth: it is rebuilt on every push to main, so it cannot drift
# from the pins.
#
# Outside GitHub (e.g. an OpenHands sandbox) an agent pulls the image once
# (free, public package) and mounts the repo; subsequent sessions reuse the
# local Docker layer cache. This removes the repeated `curl elan` +
# `elan toolchain install` + `lake exe cache get` that every fresh sandbox
# currently pays.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-stage: a builder stage clones the pinned toolchain + Mathlib
      # oleans (via the community Azure cache), then those layers are COPIED
      # into the pushed image. Result: pulling the ghcr image gives a warm
      # elan + Lean + Mathlib olean cache with zero network beyond `docker pull`.
      # GHCR requires lowercase repository names; github.repository can be
      # mixed-case (e.g. allenpd728/PleaNP). Use the lowercase owner + a fixed
      # image slug (pleanp) instead of github.repository, avoiding expressions
      # in the tags block entirely (expressions there are unreliable).
      - name: Build warm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.warm
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pleanp:lean-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pleanp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pleanp:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: echo "Pushed ghcr.io/${{ github.repository }}:main (warm Lean+Mathlib for agents)"

  # Keep CI itself fast: cache elan+Lean between runs so fresh runners skip the
  # `curl elan + toolchain install` step.
  ci-toolchain-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan+Lean toolchain
        uses: actions/cache@v4
        id: lean-cache
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan (only on cache miss)
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Show cached toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
        working-directory: lean