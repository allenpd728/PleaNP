# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

# formalization.yaml (v0.4): repo-root metadata for formalization projects.

# Adopted (DEC-022, 2026-09-10) — see docs/LEAN_FORMALIZATION_LESSONS_2026-09-10.md §3.2.
# This file is a checked artifact: it must be parse-valid YAML at commit time.
# The repo's stdlib mini-YAML parser (tooling/galaxy/miniyaml.py) and the
# galaxy_data layer read it; CI regenerates galaxy.html from it. Any
# malformation is tracked (see issue #43) and must be fixed, not shipped.
# Align ontology with the mathlib-initiative
# schema (the OpenAI NavierStokesAndEuler release used this exact schema version).
# The manifest is declarative data — the executable gate scanners remain the source of truth
# (tooling/gates/*.py). A future CI job may assert the rows(e.g. run `axiom_check.py` per
# declared `axioms[]`)as aspirational follow-up,not implemented in this commit.

version: "v0.4"

project:
 name: "PleaNP"
 description: >-
    Formal barrier landscape of computational complexity theory in Lean 4: relativization,
    natural proofs, and algebrization, plus the barrier-calculus integrity machinery that makes
    AI-assisted proof search honest. Not a claim to resolve P vs NP;imports P/NP from upstream Mathlib.

 authors:
 - "PleaNP contributors"
 license: "Apache-2.0"

sources:
 - title: "Relativizations of the P =? NP Question"
   authors:
     - "Baker"
     - "Gill"
     - "Solovay"
   type: "article"
   location: "Theorem (a) and (b)"
   relationship: "formalizes"
 - title: "The algorithm for a natural proof"
   authors:
     - "Razborov"
     - "Rudich"
   type: "article"
   location: "Main theorem (natural proofs barrier)"
   relationship: "formalizes"
 - title: "Algebrization: A New Barrier in Complexity Theory"
   authors:
     - "Aaronson"
     - "Wigderson"
   type: "article"
   location: "Main theorem (algebrization barrier)"
   relationship: "formalizes"

related_formalizations:
 - id: "https://github.com/openai/NavierStokesAndEuler"
   relationship: "adapts"
   note: >-
     Comparator challenge + formalization.yaml + standalone paper-theorem-file layout
     adopted from this two-thousand-six-hundred-fifty-five-file forced-Navier-Stokes Lean release
     (2026-09-08/10). See docs/LEAN_FORMALIZATION_LESSONS_2026-09-10.md.
 - id: "https://github.com/tristanbuckmaster/fluid_lean"
   relationship: "adapts"
   note: >-
     Concurrent forced-Euler + Boussinesq Lean release (2026-09-08) — same statement-fidelity
     family as a 3,748-file Lean archive. See docs/LEAN_FORMALIZATION_LESSONS_2026-09-10.md.


classification:
 arxiv:
 - "cs.CC"
 msc2020:
 - "68Q15"
 - "68Q17"

status:
 scope: "Formal barrier library + integrity gates (rungs 1–11 per docs/ROADMAP.md)."
 sorry_count: 2
 sorry_in_definitions: 0
 main_results:
 - description: >-
     (BGS clause a) Existence of an oracle A with P^A = NP^A.(Statement rendered,sorry.)
   declaration: "PleaNP.Barriers.Relativization.exists_equalizing_oracle"
   file: "lean/PleaNP/Barriers/Relativization.lean"
   sorry_count: 1
   axioms:
     - "sorryAx"
   comparator_config: "lean/ComparatorChallenges/Relativization.json"
   status: "rendered-not-frozen"
 - description: >-
     (BGS clause b) Existence of an oracle B with P^B ≠ NP^B.(Statement rendered,sorry.)
   declaration: "PleaNP.Barriers.Relativization.exists_separating_oracle"
   file: "lean/PleaNP/Barriers/Relativization.lean"
   sorry_count: 1
   axioms:
     - "sorryAx"
   comparator_config: "lean/ComparatorChallenges/Relativization.json"
   status: "rendered-not-frozen"
 - description: >-
     Oracle-machine substrate: decidability in polynomial time over a machine+oracle. Clean
     (0 sorries), Green in CI)
   declaration: "PleaNP.Oracles.DecidesInTime"
   file: "lean/PleaNP/Computability/Oracle.lean"
   sorry_count: 0
   axioms:
     - "propext"
     - "Classical.choice"
     - "Quot.sound"
   status: "validated-in-ci"
 - description: >-
     P^A / NP^A complexity classes over the oracle substrate (clean, green in CI)
   declaration: "PleaNP.Oracles.P_A_subset_NP_A"
   file: "lean/PleaNP/Computability/OracleComplexity.lean"
   sorry_count: 0
   axioms:
     - "propext"
     - "Classical.choice"
     - "Quot.sound"
   status: "validated-in-ci"
 - description: >-
     Oracle-sensitivity smoke test (two oracles one machine:accept/reject distinction)
   declaration: "PleaNP.Oracles.smoke_accepts_true"
   file: "lean/PleaNP/Computability/OracleSmoke.lean"
   sorry_count: 0
   axioms:
     - "propext"
     - "Classical.choice"
     - "Quot.sound"
   status: "validated-in-ci"
 - description: >-
     Barrier Calculus: Relativizing typeclass + #barrier_check elaborator (clean, green in CI)
   declaration: "PleaNP.Calculus.thhStatement"
   file: "lean/PleaNP/Calculus/BarrierCalculus.lean"
   sorry_count: 0
   axioms:
     - "propext"
     - "Classical.choice"
     - "Quot.sound"
   status: "validated-in-ci"
 - description: >-
     Algebrization barrier consequence (AZ3, issue #69 Pass 2): no algebrizing-uniform
     resolution of P vs NP — given AW09 separating + equalizing low-degree pairs, neither
     uniform direction survives the asymmetric-access model (clean, green in CI)
   declaration: "PleaNP.Barriers.AlgebrizationProof.no_algebrizing_uniform_resolution"
   file: "lean/PleaNP/Barriers/AlgebrizationProof.lean"
   sorry_count: 0
   axioms:
     - "propext"
     - "Classical.choice"
     - "Quot.sound"
   status: "validated-in-ci"

automation:
 methods:
 - method: "agent"
 models:
 - "OpenHands"
 framework: "multi-agent-github-issue-protocol"

review:
 status: "self-assessed"

alignment:
 namespaces:
 - "PleaNP.Barriers"
 - "PleaNP.Calculus"
 - "PleaNP.Challenges"
 - "PleaNP.Computability"
 - "PleaNP.Oracles"
 statements:
    - source: "BGS 1975 Theorem (a), per docs/STATEMENTS/Relativization.md"
      lean: "PleaNP.Barriers.Relativization.exists_equalizing_oracle"
      module: "PleaNP.Barriers.Relativization"
      status: "rendered-not-frozen"
    - source: "BGS 1975 Theorem (a) — DEC-022 comparator reference (independent channel)"
      lean: "PleaNP.Challenges.Relativization.equalizing_oracle_statement"
      module: "PleaNP.Challenges.Relativization"
      status: "statement-reference"
    - source: "BGS 1975 Theorem (b), per docs/STATEMENTS/Relativization.md"
      lean: "PleaNP.Barriers.Relativization.exists_separating_oracle"
      module: "PleaNP.Barriers.Relativization"
      status: "rendered-not-frozen"
    - source: "BGS 1975 Theorem (b) — DEC-022 comparator reference (independent channel)"
      lean: "PleaNP.Challenges.Relativization.separating_oracle_statement"
      module: "PleaNP.Challenges.Relativization"
      status: "statement-reference"
    - source: "P^A ⊆ NP^A inclusion (VALIDATION_SUITE must-prove)"
      lean: "PleaNP.Oracles.P_A_subset_NP_A"
      module: "PleaNP.Computability.OracleComplexity"
      status: "proved"
    - source: "Oracle-sensitivity smoke (VALIDATION_SUITE smoke test) "
      lean: "PleaNP.Oracles.smoke_accepts_true"
      module: "PleaNP.Computability.OracleSmoke"
      status: "proved"
    - source: "Barrier Calculus unit test against time hierarchy (THH relativizes → DEAD)"
      lean: "PleaNP.Calculus.thhStatement"
      module: "PleaNP.Calculus.BarrierCalculus"
      status: "proved"
    - source: "BGS barrier consequence (DEC-022 §3.3 proof-work, issue #66): a uniform collapse is contradicted by the separating oracle"
      lean: "PleaNP.Barriers.RelativizationProof.uniform_collapse_contradicted_by_separating"
      module: "PleaNP.Barriers.RelativizationProof"
      status: "proved"
    - source: "BGS barrier consequence (DEC-022 §3.3 proof-work, issue #66): a uniform separation is contradicted by the equalizing oracle"
      lean: "PleaNP.Barriers.RelativizationProof.uniform_separation_contradicted_by_equalizing"
      module: "PleaNP.Barriers.RelativizationProof"
      status: "proved"
    - source: "BGS barrier consequence (DEC-022 §3.3 proof-work, issue #66): neither uniform direction resolves P vs NP"
      lean: "PleaNP.Barriers.RelativizationProof.no_uniform_resolution_of_p_vs_np"
      module: "PleaNP.Barriers.RelativizationProof"
      status: "proved"
    - source: "BGS clause (a) A2 console oracle (issue #63 Pass 1): empty-word console oracle is total + Computable"
      lean: "PleaNP.Barriers.RelativizationProof.consoleOracleEmpty_computable"
      module: "PleaNP.Barriers.RelativizationProof"
      status: "proved"
    - source: "BGS clause (a) A2 console oracle (issue #63 Pass 1): leading-bit console oracle is total + Computable"
      lean: "PleaNP.Barriers.RelativizationProof.consoleOracleHead_computable"
      module: "PleaNP.Barriers.RelativizationProof"
      status: "proved"
    - source: "Rung-4 barrier-classification method spine (issue #73 Pass 1): Relativizing membership ⟹ oracle-uniform via the #65 soundness bridge"
      lean: "PleaNP.Calculus.Classification.classification_uniform"
      module: "PleaNP.Calculus.Classification"
      status: "proved"
    - source: "Rung-4 barrier-classification method demo (issue #73 Pass 1): the A3 one-query machine's constant-oracle language membership is oracle-uniform"
      lean: "PleaNP.Calculus.Classification.oneQuery_classification_uniform"
      module: "PleaNP.Calculus.Classification"
      status: "proved"
    - source: "Rung-4 barrier classification (issue #73 Pass 2): AC0/parity lower bound relativizes (oracle-uniform via the Rung-4 method)"
      lean: "PleaNP.Circuits.AC0.parity_notin_AC0_relativizing"
      module: "PleaNP.Circuits.AC0"
      status: "proved"
    - source: "Algebrization AW09 v1 clause (a) statement (issue #69 Pass 1): exists recursive oracle + low-degree extension separating NP^A from P^Ã (asymmetric access)"
      lean: "PleaNP.Barriers.Algebrization.algebrizing_separation_statement"
      module: "PleaNP.Barriers.Algebrization"
      status: "statement-rendered"
    - source: "Algebrization AW09 v1 clause (b) statement (issue #69 Pass 1): exists recursive oracle + low-degree extension with P^B = NP^B̃ (asymmetric access)"
      lean: "PleaNP.Barriers.Algebrization.algebrizing_equalization_statement"
      module: "PleaNP.Barriers.Algebrization"
      status: "statement-rendered"
    - source: "Rung-4 circuit substrate (issue #71 Pass 1): typed Boolean gate terms + structural size/depth + BoolFunc + circuit-family shape"
      lean: "PleaNP.Circuits.BoolGate.size"
      module: "PleaNP.Circuits.Basic"
