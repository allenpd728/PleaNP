    - source: "Rung-4 circuit substrate (issue #71 Pass 2): P/poly shape (IsPPoly) + natural property (Largeness/Constructive/NaturalProperty) + univ_largeness sanity"
      lean: "PleaNP.Circuits.NaturalProperty"
      module: "PleaNP.Circuits.Basic"
      status: "proved"
    - source: "Williams transfer statement anchors (issue #88 Pass 1): CircuitSAT decision problem + ACC0 shape + NEXP statement"
      lean: "PleaNP.Barriers.Williams.CircuitSAT"
      module: "PleaNP.Barriers.Williams"
      status: "statement-rendered"
    - source: "Monotone-circuit model (issue #74 Pass 1): monotone gate basis + size/depth + monotonicity theorem"
