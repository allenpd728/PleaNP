      module: "PleaNP.Circuits.Monotone"
      status: "proved"
    - source: "Williams transfer theorem statement (issue #90 Pass 3): sub-exponential ACC0-CircuitSAT implies NEXP not-subset ACC0 + classification record"
      lean: "PleaNP.Barriers.WilliamsTransfer.williams_transfer"
      module: "PleaNP.Barriers.WilliamsTransfer"
      status: "statement-rendered"

