<style>

  html, body { height: 100%; margin: 0; overflow: hidden; }

  }

  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  header {
    position: fixed; top: 16px; left: 18px; z-index: 5; pointer-events: none;
    max-width: min(78vw, 460px);
  }
  header h1 { margin: 0; font-size: clamp(13px, 3.4vw, 17px); font-weight: 600;
              letter-spacing: 0.05em; }
  header p { margin: 4px 0 0; font-size: clamp(10px, 2.6vw, 12px); color: var(--dim);
             line-height: 1.4; }

    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; font-size: 12px; backdrop-filter: blur(4px);
    display: none; max-width: 220px;
  }
  #legend.open { display: block; }
  #legend h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
               letter-spacing: 0.12em; color: var(--dim); font-weight: 600; }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #legendToggle {
    position: fixed; right: 16px; top: 16px; z-index: 7;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 9px; padding: 7px 11px; font: inherit; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  #tip {
    position: fixed; z-index: 8; max-width: min(84vw, 340px); pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; font-size: 12px; line-height: 1.45; opacity: 0;
    transition: opacity 0.12s ease; backdrop-filter: blur(4px);
  }

  #tip .t-gate { display: inline-block; padding: 1px 7px; border-radius: 999px;
                 font-size: 11px; margin-bottom: 5px; }
  #tip .t-body { color: var(--dim); }
  #hud {
    position: fixed; bottom: 14px; left: 0; right: 0; z-index: 4; text-align: center;
    font-size: 11px; color: var(--dim); pointer-events: none; padding: 0 14px;
    display: flex; justify-content: center; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  #hud .sep { color: #3e4c63; }
  #watermark {
    position: fixed; bottom: 14px; right: 16px; z-index: 5; pointer-events: none;
    font-size: 10px; color: rgba(138,160,184,0.55); letter-spacing: 0.08em;
    text-transform: uppercase; text-align: right; line-height: 1.5; max-width: 52vw;
  }
  @media (max-width: 700px) {
    #legend { top: auto; bottom: 58px; right: 50%; transform: translateX(50%);
              left: auto; display: none; max-width: 88vw; }
    #legend.open { display: block; }
    #legendToggle { bottom: 16px; right: 50%; transform: translateX(50%); top: auto; }
    header p { display: none; }
    #watermark { max-width: 66vw; }
  }

lean:72", "gate": "hygiene", "detail": "`exists_separating_oracle_assembly` - the assembled \"exists B, P_A B != NP_A B\" (the BGS clause-(b) target #9). Needs the Machine-to-Code bridge (#23/#97 gap: poly-time oracle machines into Partrec.Code) plus the stage/tournament composition of the Diagonal* modules. — pending: #23/#97 gap (Machine-", "radius": 0.75, "source": "docs/SORRY_TRACKER.md", "declarations": ["Partrec.Code"], "color": "#30a46c"}, {"label": "sorry: P^∅ = P statement-level sorry (RHS was `{ L", "gate": "hygiene", "detail": "sorry }`) — pending: issue #40 (v5-word-query tests)", "radius": 0.75, "source": "docs/SORRY_TRACKER.md", "declarations": ["#6"], "color": "#30a46c"}, {"label": "review: Relativizing.funeq/funne are oracle-oblivious atoms, not pointwise-pro", "gate": "readback", "detail": "Is it correct that function equality/inequality of FIXED predicates us marked oracle-oblivious(unconditionally relativizing),even though individual fibers may be oracle-dependent?", "radius": 0.9, "source": "reviews/pending/20260907-210443-35bf.yaml", "declarations": ["PleaNP.Calculus.Relativizing.funeq"], "color": "#b45be6"}, {"label": "review: marker-funeq (Gate 3 disagreement)", "gate": "readback", "detail": "On the concrete oracle-varied example, the equality L1 = L2 still relativizes without marking the individual fibers L1 x, L2 x. Was the marker intended to be an unconditional oracle-oblivious atom (as implemented), or to require pointwise propagation from the fibers (as originally requested in #1)? Reply confirm for the as-implemented unconditional-atom reading, or flag <reason> if the pointwise reading was intended.", "radius": 0.9, "source": "reviews/pending/20260913-191150-5edf.yaml", "declarations": ["atom,pw"], "color": "#b45be6"}], "metadata": {"repo": "PleaNP", "generator": "galaxy_data.build_galaxy (stdlib; issue #86)", "barrier_names": ["Relativization", "NaturalProofs", "Algebrization"], "horizon_count": 3, "asteroid_count": 15, "gate_colors": { /* ---- helpers -------------------------------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash01(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i); h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 10000) / 10000;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
}[ch]));

/* ---- world / view state --------------------------------------------- */

  yaw: 0.42, pitch: 0.30,
  targetYaw: 0.42, targetPitch: 0.30,
  zoom: 1, targetZoom: 1,       // 1 = auto-fit baseline
  dragging: false, pinching: false,
  pinchD: 0, lastX: 0, lastY: 0,
};
const pointers = new Map();

const holes = [];
const asteroids = [];

  dead: "#e5484d", vacuity: "#f2b544", model: "#3e7bfa",
  readback: "#b45be6", hygiene: "#30a46c", unresolved: "#8d8d8d",
};

/* ---- build scene ---------------------------------------------------- */
(function buildScene() {
  const H = GALAXY.barriers || [];
  const HZ = GALAXY.horizons || [];
  const orbit = TAU / Math.max(1, H.length);
  H.forEach((bar, i) => {
    const a = i * orbit + hash01(bar.name) * 0.6;
    const rad = 3.6;
    holes.push({
      name: bar.name,
      x: Math.cos(a) * rad,
      z: Math.sin(a) * rad,
      y: (i % 2 === 0 ? 1 : -1) * 0.5,
      desc: bar.description || "",
      decls: (bar.declarations || []).length,
      horizon: HZ[i] || { proven: [], rendered: [], boundary: [] },
    });
  });
  (GALAXY.asteroids || []).forEach((a, i) => {
    const theta = hash01("ast" + i) * TAU;
    const rad = 5.6 + hash01("rad" + i) * 2.9;
    asteroids.push({
      label: a.label || "?",
      gate: a.gate || "unresolved",
      color: a.color || colors[a.gate] || colors.unresolved,
      detail: a.detail || "",
      radius: clamp((a.radius || 1) * 0.055, 0.03, 0.16),
      x: Math.cos(theta) * rad,
      y: (hash01("y" + i) - 0.5) * 2.2,
      z: Math.sin(theta) * rad,
    });
  });
  buildLegend();
})();

function buildLegend() {
  const seen = {};
  asteroids.forEach((a) => { seen[a.gate] = a.color; });
  const names = { dead: "DEAD (relativizing)", vacuity: "vacuity / Gate 5",
                  model: "model / Gate 2", readback: "fidelity / Gate 3+4",
                  hygiene: "hygiene / Gate 6", unresolved: "unresolved" };
  const order = ["dead", "vacuity", "model", "readback", "hygiene", "unresolved"];
  const ul = document.getElementById("legendList");
  ul.innerHTML = "";
  order.forEach((g) => {
    if (!seen[g]) return;
    const li = document.createElement("li");
    li.innerHTML = `<span class="swatch" style="background:${seen[g]}"></span>`
      + `<span>${names[g] || g}</span>`;
    ul.appendChild(li);
  });
  const li = document.createElement("li");
  li.style.marginTop = "8px";
  li.innerHTML = `<span class="swatch" style="background:#0b0f1a;border:1px solid #3e4c63"></span>`
    + "<span>residual freedom</span>";
  ul.appendChild(li);
}

/* ---- projection (world → normalized perspective) -------------------- */
function project(x, y, z) {
  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  const y1 = y * cp - z1 * sp;
  const z2 = y * sp + z1 * cp;
  const persp = 4.0 / (4.0 + z2 + 2.0);
  return { x: x1 * persp, y: y1 * persp, s: persp };
}

let W = 0, Hpx = 0, SCALE = 240;

function fitScale() {
  const pts = [];
  holes.forEach(h => pts.push(project(h.x, h.y, h.z)));
  asteroids.forEach(a => pts.push(project(a.x, a.y, a.z)));
  const pad = 0.72;
  const spanX = Math.max(2.0, (Math.max(...pts.map(p => p.x)) - Math.min(...pts.map(p => p.x))));
  const spanY = Math.max(2.0, (Math.max(...pts.map(p => p.y)) - Math.min(...pts.map(p => p.y))));
  return Math.min(W * pad / spanX, Hpx * pad / spanY);
}

function resize() {
  W = window.innerWidth; Hpx = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = Hpx * dpr;
  canvas.style.width = W + "px"; canvas.style.height = Hpx + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SCALE = fitScale();
}

/* world → canvas pixels */
function w2c(p) {
  return { x: W / 2 + p.x * SCALE * view.zoom, y: Hpx / 2 + p.y * SCALE * view.zoom };
}

/* ---- render --------------------------------------------------------- */
const canvas = document.getElementById("glx");
const ctx = canvas.getContext("2d");

function draw() {
  ctx.clearRect(0, 0, W, Hpx);
  const cx = W / 2, cy = Hpx / 2;
  view.yaw += (view.targetYaw - view.yaw) * 0.06;
  view.pitch += (view.targetPitch - view.pitch) * 0.06;
  view.zoom += (view.targetZoom - view.zoom) * 0.1;

  // residual-freedom starfield (screen-space speckle, never moves)
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < 200; i++) {
    const sx = hash01("s" + i) * W, sy = hash01("t" + i) * Hpx;
    ctx.globalAlpha = 0.1 + hash01("u" + i) * 0.45;
    ctx.fillRect(sx, sy, 1, 1);
  }
  ctx.globalAlpha = 1;

  drawGrid(cx, cy);

  // asteroids — far to near
  asteroids
    .map((a) => ({ a, p: project(a.x, a.y, a.z) }))
    .sort((m, n) => n.p.s - m.p.s)
    .forEach(({ a, p }) => {
      const c = w2c(p);
      const r = Math.max(0.02, a.radius * SCALE * view.zoom * p.s * 2.2);
      if (c.x < -80 || c.x > W + 80 || c.y < -80 || c.y > Hpx + 80) return;
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 3);
      g.addColorStop(0, a.color); g.addColorStop(0.35, a.color + "cc");
      g.addColorStop(1, "transparent");
      ctx.globalAlpha = clamp(p.s * 1.4, 0.25, 1);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, r * 3, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = a.color; ctx.beginPath(); ctx.arc(c.x, c.y, r * 1.7, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(c.x - r * 0.55, c.y - r * 0.55, r * 0.5, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    });

  // black holes + horizons
  holes.forEach((h) => {
    const p = project(h.x, h.y, h.z);
    const c = w2c(p);
    const s = SCALE * view.zoom * p.s;
    const ringR = Math.max(0.02, 1.45 * 2.0 * s);
    const holeR = Math.max(0.01, 2.0 * s);
    // event horizon
    ctx.strokeStyle = "rgba(120,170,255,0.30)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, ringR, ringR * 0.45, 0, 0, TAU);
    ctx.stroke();
    const horiz = h.horizon || {};
    const ticks = (horiz.proven || []).length;
    const marks = (horiz.rendered || []).length + (horiz.boundary || []).length;
    drawTicks(c.x, c.y, ringR, ticks, "#55d6be");
    drawTicks(c.x, c.y, ringR, marks, "#f2c14e", Math.PI, ticks);
    // disk
    const g = ctx.createRadialGradient(c.x - holeR * 0.2, c.y - holeR * 0.2, 0,
                                       c.x, c.y, holeR);
    g.addColorStop(0, "#000"); g.addColorStop(0.55, "#0a0e1a");
    g.addColorStop(1, "#161d33");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, holeR, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(140,160,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();
    // glow
    ctx.strokeStyle = "rgba(80,110,220,0.16)";
    ctx.lineWidth = holeR * 0.5;
    ctx.beginPath(); ctx.arc(c.x, c.y, holeR * 0.8, 0, TAU); ctx.stroke();
    // labels (fade out when zoomed way out)
    if (view.zoom > 0.35) {
      const lbl = clamp(SCALE * view.zoom * 0.014, 8, 13);
      ctx.fillStyle = "#d9e2ec";
      ctx.font = "600 " + lbl + "px ui-monospace, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText(h.name, c.x, c.y + holeR + lbl * 1.6);
      ctx.fillStyle = "#8aa0b8";
      ctx.font = "11px ui-monospace, Menlo, monospace";
      ctx.fillText(h.decls + " declared · " + (horiz.boundary || []).length
                   + " at boundary", c.x, c.y + holeR + lbl * 2.9);
    }
  });

  requestAnimationFrame(draw);
}

function drawTicks(px, py, ringR, count, color, angleStart = 0, offset = 0) {
  if (count <= 0) return;
  ctx.strokeStyle = color; ctx.lineWidth = 1.2;
  for (let i = 0; i < count; i++) {
    const a = angleStart + (i + offset) / Math.max(count + offset, 1) * Math.PI;
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(a) * ringR * 0.82, py + Math.sin(a) * ringR * 0.42);
    ctx.lineTo(px + Math.cos(a) * ringR * 1.06, py + Math.sin(a) * ringR * 0.54);
    ctx.stroke();
  }
}

function drawGrid(cx, cy) {
  // Flat floor-plane grid, rotated by yaw only (a baseline depth cue).
  const cyaw = Math.cos(view.yaw), syaw = Math.sin(view.yaw);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const extent = 9.5, step = 2.0;
  ctx.strokeStyle = "rgba(90,120,190,0.9)";
  ctx.lineWidth = 1;
  const grid = (x, z) => {
    const x1 = x * cyaw - z * syaw;
    const z1 = x * syaw + z * cyaw;
    const z2 = 0 * sp + z1 * cp;
    const persp = 4.0 / (4.0 + z2 + 2.0);
    return { x: cx + x1 * persp * SCALE * view.zoom, y: cy + (0) * persp * SCALE + 0,
             depth: z1 };
  };
  ctx.save();
  const rows = [];
  for (let g = -extent; g <= extent + 0.01; g += step) {
    rows.push([grid(g, -extent), grid(g, extent)]);
    rows.push([grid(-extent, g), grid(extent, g)]);
  }
  rows.forEach(([a, b]) => {
    const depth = (a.depth + b.depth) / 2;
    ctx.globalAlpha = clamp(0.06 + (4.5 - Math.abs(depth)) * 0.045, 0.03, 0.30);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---- tooltip -------------------------------------------------------- */
const tip = document.getElementById("tip");
function hitTest(mx, my) {
  let best = null, bestD = 1e9;
  const add = (x, y, r, el, isAst) => {
    const d = Math.hypot(mx - x, my - y) - r;
    if (d < bestD && d < 6) { bestD = d; best = { el, isAst }; }
  };
  asteroids.forEach((a) => {
    const p = project(a.x, a.y, a.z);
    const c = w2c(p);
    add(c.x, c.y, Math.max(0.02, a.radius * SCALE * view.zoom * p.s * 2.2), a, true);
  });
  holes.forEach((h) => {
    const p = project(h.x, h.y, h.z);
    const c = w2c(p);
    add(c.x, c.y, 2.0 * SCALE * view.zoom * p.s, h, false);
  });
  return best;
}

function showTip(x, y, el) {
  if (!el) { tip.style.opacity = "0"; return; }
  const c = el.el;
  const title = c.name || c.label || "?";
  let gate = "", body = "";
  if (el.isAst) {
    gate = `<span class="t-gate" style="background:${c.color}22;color:${c.color}">`
      + `gate: ${c.gate}</span>`;
    body = `<div class="t-body">${esc(c.detail || "")}</div>`;
  } else {
    const horiz = c.horizon || {};
    gate = `<span class="t-gate" style="background:#55d6be22;color:#55d6be">barrier</span>`;
    body = `<div class="t-body">${esc(c.desc || "")}<br>`
      + `proven: ${(horiz.proven || []).length} · rendered: ${(horiz.rendered || []).length}`
      + ` · boundary: ${(horiz.boundary || []).length}</div>`;
  }
  tip.innerHTML = `<div class="t-title">${esc(title)}</div>${gate}${body}`;
  const tw = tip.offsetWidth, th = tip.offsetHeight, pad = 10;
  tip.style.left = clamp(x + 12, pad, W - tw - pad) + "px";
  tip.style.top = clamp(y + 12, pad, Hpx - th - pad) + "px";
  tip.style.opacity = "1";
}

/* ---- interaction ---------------------------------------------------- */
function zoomBy(f) {
  view.targetZoom = clamp(view.targetZoom * f, 0.4, 8);
  document.getElementById("zoomHud").textContent = (view.targetZoom * 100).toFixed(0) + "%";
}

function pointerCountActive() {
  return pointers.size;
}

canvas.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1) {
    view.dragging = true;
    view.lastX = e.clientX; view.lastY = e.clientY;
    canvas.classList.add("drag");
  } else if (pointers.size === 2) {
    view.dragging = false; view.pinching = true;
    canvas.classList.remove("drag");
    const pts = [...pointers.values()];
    view.pinchD = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  if (view.pinching && pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (view.pinchD > 0) zoomBy(d / view.pinchD);
    view.pinchD = d;
    return;
  }
  if (view.dragging) {
    view.targetYaw += (e.clientX - view.lastX) * 0.005;
    view.targetPitch = clamp(view.targetPitch + (e.clientY - view.lastY) * 0.004, -0.8, 1.2);
    view.lastX = e.clientX; view.lastY = e.clientY;
  } else {
    showTip(e.clientX, e.clientY, hitTest(e.clientX, e.clientY));
  }
});

function pointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) view.pinching = false;
  if (pointers.size === 0) {
    view.dragging = false;
    canvas.classList.remove("drag");
  }
}
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", pointerUp);
canvas.addEventListener("pointerleave", () => { if (!view.dragging) tip.style.opacity = "0"; });

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomBy(Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

canvas.addEventListener("dblclick", () => {
  view.targetZoom = 1; view.targetYaw = 0.42; view.targetPitch = 0.30;
  document.getElementById("zoomHud").textContent = "fit";
});

const legend = document.getElementById("legend");
const legendToggle = document.getElementById("legendToggle");
legendToggle.addEventListener("click", (e) => {
  e.stopPropagation();
  legend.classList.toggle("open");
});

document.getElementById("zoomHud").textContent = "fit";
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
