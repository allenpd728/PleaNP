<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PleaNP — Barrier Galaxy</title>
<style>
  :root {
    --bg: #06070c; --ink: #d9e2ec; --dim: #8aa0b8;
    --panel: rgba(15, 18, 28, 0.86); --line: #1c2638;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% 35%, #0b0f1a 0%, var(--bg) 60%);
    color: var(--ink); font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  header {
    position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
  }
  header h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.06em;
  }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--dim); }
  #legend {
    position: fixed; right: 22px; top: 18px; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; backdrop-filter: blur(4px);
  }
  #legend h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
               letter-spacing: 0.12em; color: var(--dim); font-weight: 600; }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #tip {
    position: fixed; z-index: 6; max-width: 340px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; line-height: 1.45; opacity: 0;
    transition: opacity 0.12s ease; backdrop-filter: blur(4px);
  }
  #tip .t-title { font-weight: 700; margin-bottom: 4px; }
  #tip .t-gate { display: inline-block; padding: 1px 7px; border-radius: 999px;
                  font-size: 11px; margin-bottom: 5px; }
  #tip .t-body { color: var(--dim); }
  footer {
    position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--dim); z-index: 4; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="glx"></canvas></div>

<header>
  <h1>&#9737; PLEANP &#183; BARRIER GALAXY</h1>
  <p>The negative space of P&#8201;vs&#8201;NP: where proof techniques cannot go.</p>
</header>

<div id="legend">
  <h2>Legend</h2>
  <ul id="legendList"></ul>
</div>

<div id="tip"></div>
<footer>orbit: drag &middot; hover: detail &middot; canvas generated offline, no network</footer>

<script>
/* ---- data (embedded JSON) ------------------------------------------- */
const GALAXY = {"barriers": [{"name": "Relativization", "description": "Barrier Calculus: Relativizing typeclass + #barrier_check elaborator (clean, green in CI)", "declarations": ["PleaNP.Barriers.Relativization.exists_equalizing_oracle", "PleaNP.Barriers.Relativization.exists_separating_oracle", "PleaNP.Calculus.thhStatement"], "declarations_meta": [{"declaration": "PleaNP.Barriers.Relativization.exists_equalizing_oracle", "status": "rendered-not-frozen", "file": "lean/PleaNP/Barriers/Relativization.lean", "sorry_count": 1}, {"declaration": "PleaNP.Barriers.Relativization.exists_separating_oracle", "status": "rendered-not-frozen", "file": "lean/PleaNP/Barriers/Relativization.lean", "sorry_count": 1}, {"declaration": "PleaNP.Calculus.thhStatement", "status": "validated-in-ci", "file": "lean/PleaNP/Calculus/BarrierCalculus.lean", "sorry_count": 0}]}, {"name": "NaturalProofs", "description": "The algorithm for a natural proof", "declarations": [], "declarations_meta": []}, {"name": "Algebrization", "description": "Algebrization: A New Barrier in Complexity Theory", "declarations": [], "declarations_meta": []}], "horizons": [{"barrier": "Relativization", "proven": ["PleaNP.Calculus.thhStatement", "N1 — P_A ⊆ NP_A for every oracle [theorem]", "N2 — equalizing renderings agree [theorem]", "N3 — separating_D → separating_B (easy dir) [theorem]"], "rendered": ["PleaNP.Barriers.Relativization.exists_equalizing_oracle", "PleaNP.Barriers.Relativization.exists_separating_oracle"], "boundary": ["N4 — separating_B → separating_D (hard dir) [def]", "N5 — ∃ equalizing oracle (BGS (a)) [def]", "N6 — ∃ separating oracle (BGS (b)) [def]"]}, {"barrier": "NaturalProofs", "proven": [], "rendered": [], "boundary": []}, {"barrier": "Algebrization", "proven": [], "rendered": [], "boundary": []}], "asteroids": [{"label": "bgs: A ≢ B", "gate": "readback", "detail": "BLOCKED: the two renderings are not MACHINE-VERIFIED equivalent. Lean could not close the IFF (tried rfl/simpa/simp, and the ∀-quantified parameterized form) with mechanical tactics. A real equivalenc", "radius": 1.0, "source": "churn/bgs/matrix.json", "declarations": [], "color": "#b45be6"}, {"label": "bgs: A ≢ D", "gate": "readback", "detail": "BLOCKED: the two renderings are not MACHINE-VERIFIED equivalent. Lean could not close the IFF (tried rfl/simpa/simp, and the ∀-quantified parameterized form) with mechanical tactics. A real equivalenc", "radius": 1.0, "source": "churn/bgs/matrix.json", "declarations": [], "color": "#b45be6"}, {"label": "bgs: B ≢ C", "gate": "readback", "detail": "BLOCKED: the two renderings are not MACHINE-VERIFIED equivalent. Lean could not close the IFF (tried rfl/simpa/simp, and the ∀-quantified parameterized form) with mechanical tactics. A real equivalenc", "radius": 1.0, "source": "churn/bgs/matrix.json", "declarations": [], "color": "#b45be6"}, {"label": "bgs: B ≢ D", "gate": "readback", "detail": "BLOCKED: the two renderings are not MACHINE-VERIFIED equivalent. Lean could not close the IFF (tried rfl/simpa/simp, and the ∀-quantified parameterized form) with mechanical tactics. A real equivalenc", "radius": 1.0, "source": "churn/bgs/matrix.json", "declarations": [], "color": "#b45be6"}, {"label": "bgs: C ≢ D", "gate": "readback", "detail": "BLOCKED: the two renderings are not MACHINE-VERIFIED equivalent. Lean could not close the IFF (tried rfl/simpa/simp, and the ∀-quantified parameterized form) with mechanical tactics. A real equivalenc", "radius": 1.0, "source": "churn/bgs/matrix.json", "declarations": [], "color": "#b45be6"}, {"label": "blocker: #26 — `U_B B ∈ NP_A (alpha := Nat) B` uninhabitable under current substrate", "gate": "model", "detail": "A **human decision** on how to reconcile a hard type-level contradiction between #26's DoD and the current PleaNP oracle substrate. Thisis not a mechanism the agent can choose around: (see \"what I tri", "radius": 1.1666666666666667, "source": "open_20260907-0953_bgs26-infinite-query-fintype.md", "declarations": [], "color": "#3e7bfa"}, {"label": "blocker: #22 — BGS diagonalization inherits the infinite-Query Fintype wall from #26/#27", "gate": "model", "detail": "A **human decision** on the oracle-query alphabet (the same decision #26/#27 already await): #22's separating oracle B lives over `Query = Sigma n : Nat, Bits n` (from the frozen `BGSDiagonal.lean`),b", "radius": 1.1666666666666667, "source": "open_20260907-2110_bgs22-infinite-query-fintype.md", "declarations": [], "color": "#3e7bfa"}, {"label": "sorry: OracleUpstreamP.lean:25", "gate": "hygiene", "detail": "`P_empty_eq_upstream_P_class` — RHS set comprehension (upstream P as a set). **Statement-level sorry — Gate-5 concern** (the theorem does not yet fully say what it proves). — pending: Upstream P (DEC-003), or an oracle-free recharacterization of the class.", "radius": 0.75, "source": "docs/SORRY_TRACKER.md", "declarations": ["#6"], "color": "#30a46c"}, {"label": "sorry: OracleUpstreamP.lean:26", "gate": "hygiene", "detail": "`P_empty_eq_upstream_P_class` — proof of P^empty = P equality. — pending: #6 + upstream P.", "radius": 0.75, "source": "docs/SORRY_TRACKER.md", "declarations": ["#7"], "color": "#30a46c"}, {"label": "sorry: Relativization.lean:80", "gate": "hygiene", "detail": "BGS clause (a) proof — equalizing oracle existence. — pending: #5 (done) + PSPACE/QBF + upstream P.", "radius": 0.75, "source": "docs/SORRY_TRACKER.md", "declarations": ["#8"], "color": "#30a46c"}, {"label": "sorry: Relativization.lean:101", "gate": "hygiene", "detail": "BGS clause (b) proof — separating oracle existence (diagonalization). — pending: #5 (done) + machine enumeration + diagonalization.", "radius": 0.75, "source": "docs/SORRY_TRACKER.md", "declarations": ["#9"], "color": "#30a46c"}, {"label": "review: Relativizing.funeq/funne are oracle-oblivious atoms, not pointwise-pro", "gate": "readback", "detail": "Is it correct that function equality/inequality of FIXED predicates us marked oracle-oblivious(unconditionally relativizing),even though individual fibers may be oracle-dependent?", "radius": 0.9, "source": "reviews/pending/20260907-210443-35bf.yaml", "declarations": ["PleaNP.Calculus.Relativizing.funeq"], "color": "#b45be6"}], "metadata": {"repo": "/workspace/project/PleaNP", "generator": "galaxy_data.build_galaxy (stdlib; issue #86)", "barrier_names": ["Relativization", "NaturalProofs", "Algebrization"], "horizon_count": 3, "asteroid_count": 12, "gate_colors": {"dead": "#e5484d", "vacuity": "#f2b544", "model": "#3e7bfa", "readback": "#b45be6", "hygiene": "#30a46c", "unresolved": "#8d8d8d"}}};

/* ---- tiny helpers ---------------------------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rng = (() => { let s = 123456789; return () => {
  s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })();
function hash01(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

/* ---- scene state ----------------------------------------------------- */
const scenes = {
  yaw: 0.42,        // orbit rotation around Y
  pitch: 0.30,      // tilt around X
  targetYaw: 0.42,
  targetPitch: 0.30,
  dragging: false,
  lastX: 0, lastY: 0,
};

const holes = [];
const asteroids = [];
const colors = (GALAXY.metadata && GALAXY.metadata.gate_colors) || {
  dead: "#e5484d", vacuity: "#f2b544", model: "#3e7bfa",
  readback: "#b45be6", hygiene: "#30a46c", unresolved: "#8d8d8d",
};

/* ---- build the scene ------------------------------------------------- */
(function buildScene() {
  const H = GALAXY.barriers || [];
  const HZ = GALAXY.horizons || [];
  const R = 2.1;                       // hole radius in world units
  const RING = 1.45 * R;               // event-horizon ring radius
  const orbit = TAU / Math.max(1, H.length);
  H.forEach((bar, i) => {
    const edge = hash01(bar.name);
    holes.push({
      name: bar.name,
      x: Math.cos(i * orbit + edge) * 3.1,
      y: Math.sin(i * orbit + edge) * 3.1,
      z: (i % 2 === 0 ? 1 : -1) * 0.5,
      desc: bar.description || "",
      decls: (bar.declarations || []).length,
      edge: edge,
      horizon: HZ[i] || { proven: [], rendered: [], boundary: [] },
    });
  });
  (GALAXY.asteroids || []).forEach((a) => {
    const theta = rng() * TAU;
    const rad = 4.6 + rng() * 2.6;
    asteroids.push({
      label: a.label || "?",
      gate: a.gate || "unresolved",
      color: a.color || colors[a.gate] || colors.unresolved,
      detail: a.detail || "",
      radius: clamp((a.radius || 1) * 0.05, 0.028, 0.13),
      x: Math.cos(theta) * rad,
      y: (rng() - 0.5) * 2.4,
      z: Math.sin(theta) * rad,
    });
  });
  buildLegend();
})();

function buildLegend() {
  const seen = {};
  asteroids.forEach((a) => { seen[a.gate] = a.color; });
  const names = { dead: "DEAD (relativizing)", vacuity: "vacuity / Gate 5",
                  model: "model / Gate 2", readback: "fidelity / Gate 3+4",
                  hygiene: "hygiene / Gate 6", unresolved: "unresolved" };
  const order = ["dead", "vacuity", "model", "readback", "hygiene", "unresolved"];
  const ul = document.getElementById("legendList");
  order.forEach((g) => {
    if (!seen[g]) return;
    const li = document.createElement("li");
    li.innerHTML = `<span class="swatch" style="background:${seen[g]}"></span>`
      + `<span>${names[g] || g}</span>`;
    ul.appendChild(li);
  });
  const li = document.createElement("li");
  li.style.marginTop = "8px";
  li.innerHTML = `<span class="swatch" style="background:#0b0f1a;border:1px solid #3e4c63"></span>`
    + "<span>residual freedom</span>";
  ul.appendChild(li);
}

/* ---- projection math ------------------------------------------------- */
function project(x, y, z) {
  const cy = Math.cos(scenes.yaw), sy = Math.sin(scenes.yaw);
  const cp = Math.cos(scenes.pitch), sp = Math.sin(scenes.pitch);
  // rotate Y
  let x1 = x * cy - z * sy;
  let z1 = x * sy + z * cy;
  // rotate X (pitch)
  let y1 = y * cp - z1 * sp;
  let z2 = y * sp + z1 * cp;
  const f = 4.0;                       // camera distance
  const persp = f / (f + z2 + 2.0);    // z2 + 2 centers the scene
  return { x: x1 * persp, y: y1 * persp, s: persp };
}

/* ---- render loop ----------------------------------------------------- */
const canvas = document.getElementById("glx");
const ctx = canvas.getContext("2d");
let W = 0, Hpx = 0;

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; Hpx = window.innerHeight;
  canvas.width = W * dpr; canvas.height = Hpx * dpr;
  canvas.style.width = W + "px"; canvas.style.height = Hpx + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function draw() {
  ctx.clearRect(0, 0, W, Hpx);
  const cx = W / 2, cy = Hpx / 2;
  scenes.yaw += (scenes.targetYaw - scenes.yaw) * 0.06;
  scenes.pitch += (scenes.targetPitch - scenes.pitch) * 0.06;

  /* stars (residual freedom) */
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  for (let i = 0; i < 220; i++) {
    const sx = (hash01("s" + i) * W), sy = (hash01("t" + i) * Hpx);
    ctx.globalAlpha = 0.12 + hash01("u" + i) * 0.5;
    ctx.fillRect(sx, sy, 1, 1);
  }
  ctx.globalAlpha = 1;

  /* asteroids — draw from far to near */
  const depthOrder = asteroids
    .map((a, idx) => { const p = project(a.x, a.y, a.z); return { a, p, idx }; })
    .sort((m, n) => n.p.s - m.p.s);
  depthOrder.forEach(({ a, p }) => {
    const px = cx + p.x * W * 0.36;
    const py = cy + p.y * Hpx * 0.36;
    if (px < -60 || px > W + 60 || py < -60 || py > Hpx + 60) return;
    const r = a.radius * p.s * Hpx * 2.2;
    const grad = ctx.createRadialGradient(px, py, 0, px, py, r * 3);
    grad.addColorStop(0, a.color);
    grad.addColorStop(0.35, a.color + "cc");
    grad.addColorStop(1, "transparent");
    ctx.globalAlpha = clamp(p.s * 1.4, 0.25, 1);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(px, py, r * 3, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = a.color;
    ctx.beginPath(); ctx.arc(px, py, r * 1.7, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 0.75;
    ctx.beginPath(); ctx.arc(px - r, py - r, r * 0.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  });

  /* black holes + event horizons */
  holes.forEach((h) => {
    const p = project(h.x, h.y, h.z);
    const px = cx + p.x * W * 0.36;
    const py = cy + p.y * Hpx * 0.36;
    const ringR = RING * p.s * Hpx * 0.36;
    const holeR = R * p.s * Hpx * 0.36;
    if (ringR <= 0) return;

    // event horizon — faint blue ring, elliptical to fake 3D
    ctx.strokeStyle = "rgba(120,170,255,0.28)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(px, py, ringR, ringR * 0.45, 0, 0, TAU);
    ctx.stroke();

    // horizon stat ticks
    const horiz = h.horizon || {};
    const ticks = (horiz.proven || []).length;
    const marks = (horiz.rendered || []).length + (horiz.boundary || []).length;
    drawTicks(px, py, ringR, ticks, "#55d6be");
    drawTicks(px, py, ringR, marks, "#f2c14e", Math.PI, ticks);

    // black hole disk
    const grad = ctx.createRadialGradient(px - holeR * 0.2, py - holeR * 0.2, 0,
                                          px, py, holeR);
    grad.addColorStop(0, "#000");
    grad.addColorStop(0.55, "#0a0e1a");
    grad.addColorStop(1, "#161d33");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(px, py, holeR, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(140,160,255,0.5)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // glow
    ctx.strokeStyle = "rgba(80,110,220,0.16)";
    ctx.lineWidth = holeR * 0.5;
    ctx.beginPath(); ctx.arc(px, py, holeR * 0.8, 0, TAU); ctx.stroke();

    // label
    ctx.fillStyle = "#d9e2ec";
    ctx.font = "600 13px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText(h.name, px, py + holeR + 22);
    ctx.fillStyle = "#8aa0b8";
    ctx.font = "11px ui-monospace, Menlo, monospace";
    const declCount = h.decls;
    ctx.fillText(declCount + " declared · " + (horiz.boundary || []).length
                 + " at boundary", px, py + holeR + 38);
  });

  requestAnimationFrame(draw);
}

function drawTicks(px, py, ringR, count, color, angleStart = 0, offset = 0) {
  if (count <= 0) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  for (let i = 0; i < count; i++) {
    const a = angleStart + (i + offset) / Math.max(count + offset, 1) * Math.PI;
    const x0 = px + Math.cos(a) * ringR * 0.82;
    const y0 = py + Math.sin(a) * ringR * 0.42;
    const x1 = px + Math.cos(a) * ringR * 1.06;
    const y1 = py + Math.sin(a) * ringR * 0.54;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
}

/* ---- hover tooltip --------------------------------------------------- */
const tip = document.getElementById("tip");

function hitTest(mx, my) {
  const cx = W / 2, cy = Hpx / 2;
  let best = null, bestD = 14; // px threshold
  const candidates = [...asteroids.map((a, idx) => ({ a, idx })),
                      ...holes.map((h, idx) => ({ h, idx }))];
  for (const el of candidates) {
    const p = el.a ? project(el.a.x, el.a.y, el.a.z) : project(el.h.x, el.h.y, el.h.z);
    const clean = el.a ? el.a : el.h;
    const px = cx + p.x * W * 0.36;
    const py = cy + p.y * Hpx * 0.36;
    const rr = el.a ? el.a.radius * p.s * Hpx * 2.2 : R * p.s * Hpx * 0.36;
    const d = Math.hypot(mx - px, my - py);
    if (d - rr < bestD && d < rr + 8) {
      bestD = d - rr; best = { p, clean, asteroid: !!el.a };
    }
  }
  return best;
}

function showTip(x, y, el) {
  if (!el) {
    tip.style.opacity = "0";
    return;
  }
  const c = el.clean;
  let title = c.name || c.label || "?";
  let gate = "";
  let body = "";
  if (el.asteroid) {
    gate = `<span class="t-gate" style="background:${c.color}22;color:${c.color}">`
      + `gate: ${c.gate}</span>`;
    body = `<div class="t-body">${esc(c.detail || "")}</div>`;
  } else {
    const horiz = c.horizon || {};
    gate = `<span class="t-gate" style="background:#55d6be22;color:#55d6be">barrier</span>`;
    body = `<div class="t-body">${esc(c.desc || "")}<br>`
      + `proven: ${(horiz.proven||[]).length} · rendered: ${(horiz.rendered||[]).length}`
      + ` · boundary: ${(horiz.boundary||[]).length}</div>`;
  }
  tip.innerHTML = `<div class="t-title">${esc(title)}</div>${gate}${body}`;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const pad = 14;
  tip.style.opacity = "1";
  const tx = clamp(x + 14, pad, W - tw - pad);
  const ty = clamp(y + 14, pad, Hpx - th - pad);
  tip.style.left = tx + "px";
  tip.style.top = ty + "px";
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
  }[ch]));
}

/* ---- interaction ----------------------------------------------------- */
canvas.addEventListener("pointerdown", (e) => {
  scenes.dragging = true; scenes.lastX = e.clientX; scenes.lastY = e.clientY;
  canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (scenes.dragging) {
    scenes.targetYaw += (e.clientX - scenes.lastX) * 0.005;
    scenes.targetPitch = clamp(scenes.targetPitch + (e.clientY - scenes.lastY) * 0.004,
                               -0.7, 1.1);
    scenes.lastX = e.clientX; scenes.lastY = e.clientY;
  } else {
    const el = hitTest(e.clientX, e.clientY);
    showTip(e.clientX, e.clientY, el);
    canvas.style.cursor = el ? "pointer" : "grab";
  }
});
canvas.addEventListener("pointerup", (e) => {
  scenes.dragging = false; canvas.classList.remove("drag");
});
canvas.addEventListener("leave", () => tip.style.opacity = "0");
</script>
</body>
</html>
